<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>건네받은 등불 — 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#17130f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.btn{position:absolute;width:74px;height:74px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font:600 15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
.btn.on{background:rgba(255,200,130,.2);color:rgba(255,230,200,.85)}
#bL{left:calc(16px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
#bR{left:calc(102px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
#bG{right:calc(102px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
#bJ{right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="btn" id="bL" data-k="left">◀</div>
  <div class="btn" id="bR" data-k="right">▶</div>
  <div class="btn" id="bG" data-k="grab">잡기</div>
  <div class="btn" id="bJ" data-k="jump">점프</div>
</div>
<script>
'use strict';
/* =========================================================
   건네받은 등불 — 프로토타입 1장
   규칙: 죽으면 처음부터가 아니라, 다음 아이가 온다.
         쓰러진 아이는 그 자리에 남아 길이 된다.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
const plateCv=document.createElement('canvas'),pctx=plateCv.getContext('2d'); // 색판을 따로 찍어 두는 종이
const WH=360;
let W=0,H=0,DPR=1,S=1,VW=480,OY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  dark.width=cv.width;dark.height=cv.height;plateCv.width=cv.width;plateCv.height=cv.height;
  S=H/WH;VW=W/S;if(VW<420){S=W/420;VW=420;}OY=(H-WH*S)/2;
}
addEventListener('resize',resize);resize();

const GRAV=1400,JV=410,SPD=170,DRAG=90,PUSH=95,STEP=16;
function rng(s){return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 세계: 목포의 갯벌과 바다 ---------- */
const WORLD_END=3160;
const statics=[
  {x:-260,y:-200,w:80,h:700},   // 왼쪽 끝
  {x:-180,y:300,w:1080,h:200},  // 갯벌 길
  {x:980,y:300,w:170,h:200},    // 물골 건너편
  {x:1150,y:324,w:180,h:200},   // 펄 밑바닥 (펄 위는 무른 진흙)
  {x:1330,y:300,w:150,h:200},   // 펄 건너편
  {x:1480,y:248,w:20,h:300},    // 방조제 둑
  {x:1500,y:340,w:260,h:200},   // 물때 웅덩이 바닥
  {x:1760,y:230,w:400,h:300},   // 부두
  {x:2280,y:160,w:880,h:400},   // 방파제
  {x:3160,y:-200,w:80,h:700},   // 오른쪽 끝
  {x:2958,y:80,w:26,h:80},      // 등대
];
const LHX=2958;                   // 등대 왼쪽 끝
const spikes=[];                  // (가시는 없다)
const MUD={x:1150,w:180,top:300,bed:324};          // 펄: 서 있으면 빠진다
const BASIN={x:1500,x2:1760,floor:340};            // 물때 웅덩이: 밀물이 들어온다
const SEA={x:2160,x2:2280};                        // 부두와 방파제 사이 바다
const BOAT={x:2164,w:112,h:18};                    // 물에 뜬 작은 배
const NETR={x:2254,w:20,top:118};
const DAVX=NETR.x+52,HOOKX=NETR.x+10,THROWX=BOAT.x+56; // 기중기 기둥, 그물 고리, 투망이 떨어지는 곳                  // 방파제에서 늘어뜨리는 그물
const checkpoints=[{x:30,y:300},{x:700,y:300},{x:1010,y:300},{x:1350,y:300},{x:1820,y:230},{x:2330,y:160}];
const ENDX=LHX-18;

const grass=[];(()=>{const r=rng(7);for(const s of statics){if(s.y<290||s.y>310)continue;for(let x=s.x+2;x<s.x+s.w-2;x+=4+r()*9)grass.push([x,s.y,1+r()*3,(r()-.5)*3]);}})();
const roots=[];
const shells=[];
const STAKES=[[170,52],[198,46],[590,58],[1110,50],[1138,44],[1352,50]];
const BOLLARDS=[1850,2070,2460,2760];
const FENDERS=[[1760,262],[1760,300],[2280,196],[2280,236]];
/* 먼 풍경: 유달산, 목포대교, 섬 */
const HZ=226;
const yudal=[];(()=>{const r=rng(23);for(let x=-60;x<=330;x+=6+r()*10){const t=(x+60)/390,base=Math.sin(t*Math.PI);yudal.push([x,HZ-base*(70+r()*55)-(r()<.25?r()*20:0)]);}yudal.push([330,HZ]);yudal.unshift([-60,HZ]);})();
const islands=[[380,560,18],[930,1450,30],[1500,1800,16]];
const boats=[];(()=>{const r=rng(29);for(let x=120;x<2400;x+=260+r()*280)boats.push({x,l:56+r()*40,h:9+r()*5,c:r(),ph:r()*6});})();
const gulls=[];(()=>{const r=rng(31);for(let i=0;i<5;i++)gulls.push({x:r()*1400,y:90+r()*80,v:10+r()*14,ph:r()*6});})();

/* 물때: 26초에 한 번 들고 난다 (높을 때 250, 낮을 때 342) */
let tideT=6;
function tideLevel(){return 296-46*Math.cos(tideT*Math.PI*2/26);}
function waterAt(x){if(x>=BASIN.x&&x<BASIN.x2)return tideLevel();if(x>=SEA.x&&x<SEA.x2)return tideLevel();return null;}
function boatRect(){return{x:BOAT.x,y:tideLevel()-8,w:BOAT.w,h:BOAT.h};}
function netRect(){return net.st==='stuck'?{x:NETR.x,y:NETR.top,w:NETR.w,h:boatRect().y+6-NETR.top}:null;}

/* ---------- 상태 ---------- */
let state='title',p,objs,lantern,net,deaths,cpi,camX=-180,deadT,endT,endCardT,panDone,fade=0,jumpBuf=0,time=0,shake=0,parts=[],blood=[],stains=[],bubbles=[];
const trail=new Float32Array(560); // 등불이 지나간 자리(8px 칸마다 0~1)
function initWorld(){
  objs=[
    {type:'body',x:338,y:286,w:28,h:14,vy:0,face:-1,old:true},  // 먼저 온 아이
  ];
  lantern={x:378,y:288,w:8,h:12,vy:0,held:false,hung:false};
  net={st:'ready',t:0,y:NETR.top,r:8,caught:false};
  tideT=6;
  trail.fill(0);deaths=0;cpi=0;deadT=0;endT=0;endCardT=0;panDone=false;parts=[];blood=[];stains=[];bubbles=[];
  spawn();
}
function spawn(){
  const c=checkpoints[cpi];
  p={x:c.x,y:c.y-28,w:14,h:28,vy:0,onGround:true,coyote:0,face:1,walkT:0,held:null,dead:false,moving:false,pushing:false,sink:0,breath:1.4,inWater:false,climb:false,caught:false};
  camX=clamp(p.x+7-VW*.42,-180,WORLD_END-VW);
}
initWorld();

/* ---------- 입력 ---------- */
const keys={left:false,right:false,jump:false,grab:false},tk={left:false,right:false,jump:false,grab:false};
const inp=k=>keys[k]||tk[k];
const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ShiftLeft:'grab',ShiftRight:'grab',KeyE:'grab',KeyX:'grab'};
let isTouch=false;try{isTouch=matchMedia('(pointer:coarse)').matches;}catch(e){}
const touchEl=document.getElementById('touch');if(isTouch)touchEl.style.display='block';
function anyInput(){
  initAudio();
  if(state==='title'){state='play';fade=1;jumpBuf=0;return true;}
  if(state==='end'&&endCardT>1.2){initWorld();state='play';fade=1;jumpBuf=0;return true;}
  return false;
}
addEventListener('keydown',e=>{
  const k=km[e.code];if(k||e.code==='Enter')e.preventDefault();
  if(e.repeat)return;
  if(anyInput())return;
  if(k){if(k==='jump'&&!keys.jump)jumpBuf=.12;keys[k]=true;}
});
addEventListener('keyup',e=>{const k=km[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const ptr=new Map();
function refreshTouch(){
  const s={left:false,right:false,jump:false,grab:false};for(const k of ptr.values())s[k]=true;
  if(s.jump&&!tk.jump)jumpBuf=.12;
  for(const k in s)tk[k]=s[k];
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',s[b.dataset.k]));
}
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();isTouch=true;if(anyInput())return;try{b.setPointerCapture(e.pointerId);}catch(_){}ptr.set(e.pointerId,b.dataset.k);refreshTouch();});
  const up=e=>{ptr.delete(e.pointerId);refreshTouch();};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){isTouch=true;touchEl.style.display='block';}anyInput();});

/* ---------- 소리 ---------- */
let ac=null;
function initAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();startWind();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function startWind(){
  const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
  for(let i=0;i<2000;i++){const a=i/2000;d[i]=d[i]*a+d[len-2000+i]*(1-a);}
  const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=480;const g=ac.createGain();g.gain.value=.05;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  // 파도: 같은 소음을 천천히 부풀었다 가라앉게
  const w=ac.createBufferSource();w.buffer=buf;w.loop=true;w.playbackRate.value=.7;
  const wf=ac.createBiquadFilter();wf.type='lowpass';wf.frequency.value=900;const wg=ac.createGain();wg.gain.value=.06;
  const lfo=ac.createOscillator();lfo.frequency.value=.11;const lg=ac.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  w.connect(wf);wf.connect(wg);wg.connect(ac.destination);w.start(0,1.7);
}
function tone(f,dur,type,vol,slide,delay){if(!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);}
function noiseBurst(dur,vol){if(!ac)return;const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const n=ac.createBufferSource();n.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=ac.createGain();g.gain.value=vol;n.connect(f);f.connect(g);g.connect(ac.destination);n.start();}
function sfx(k){
  if(!ac)return;
  if(k==='pick'){tone(660,1.4,'sine',.07);tone(990,1.8,'sine',.035,0,.09);}
  else if(k==='end'){[440,554,659,880].forEach((f,i)=>tone(f,3.2,'sine',.045,0,i*.3));}
  else if(k==='drown'){tone(320,1,'sine',.07,.35);tone(180,1.3,'sine',.05,.5,.2);noiseBurst(.5,.08);}
  else if(k==='mud'){tone(80,.9,'sine',.25,.6);noiseBurst(.4,.1);}
  else if(k==='net'){noiseBurst(.35,.2);tone(140,.6,'triangle',.08,.6);}
  else if(k==='throw'){noiseBurst(.3,.06);}
  else if(k==='land'){noiseBurst(.12,.12);}
  else if(k==='fall'){tone(220,1.2,'sine',.08,.25);}
  else{tone(110,.5,'sine',.3,.35);noiseBurst(.15,.15);}
}

/* ---------- 물리 ---------- */
const solidObjs=()=>objs.filter(o=>!o.ghost);
function mudFloorP(){const cx=p.x+7;return (cx>=MUD.x&&cx<MUD.x+MUD.w)?[{x:MUD.x,y:MUD.top+p.sink,w:MUD.w,h:40,mud:true}]:[];}
function playerSolids(){return statics.concat(solidObjs(),[boatRect()],mudFloorP());}
function solidsFor(o){const a=statics.concat([boatRect(),{x:MUD.x,y:MUD.bed-12,w:MUD.w,h:30}]);for(const q of objs)if(q!==o&&!q.ghost)a.push(q);return a;}
function moveEnt(e,dx,dy,sol){
  let hit=false;
  if(dx){e.x+=dx;for(const s of sol){if(s!==e&&overlap(e,s)){e.x=dx>0?s.x-e.w:s.x+s.w;hit=true;}}}
  if(dy){e.y+=dy;for(const s of sol){if(s!==e&&overlap(e,s)){e.y=dy>0?s.y-e.h:s.y+s.h;hit=true;}}}
  return hit;
}
function freeAt(x,y){const r={x,y,w:p.w,h:p.h};return !playerSolids().some(s=>overlap(r,s));}
function movePX(dx,allowStep){
  if(!dx)return;p.x+=dx;
  for(const s of playerSolids()){
    if(!overlap(p,s))continue;
    const rise=(p.y+p.h)-s.y;
    if(allowStep&&(p.onGround||p.inWater)&&rise>0&&rise<=STEP&&freeAt(p.x,s.y-p.h)){p.y=s.y-p.h;continue;}
    p.x=dx>0?s.x-p.w:s.x+s.w;
  }
}
function adjacentObj(dir,tol,type){
  for(const o of objs){
    if(o.ghost||(type&&o.type!==type))continue;
    if(Math.abs((o.y+o.h)-(p.y+p.h))>6)continue;
    const gap=dir>0?o.x-(p.x+p.w):p.x-(o.x+o.w);
    if(gap>=-1&&gap<=tol)return o;
  }
  return null;
}
function stepPlayer(dt){
  const L=inp('left'),R=inp('right'),dir=(R?1:0)-(L?1:0),G=inp('grab');
  const wl=waterAt(p.x+7);p.inWater=wl!==null&&p.y+p.h>wl+2;
  // 그물 타기
  const nr=netRect();p.climb=!!(G&&nr&&overlap(p,nr));
  if(p.climb){p.held=null;if(dir){p.face=dir;movePX(dir*SPD*.5*dt,false);}
    p.vy=0;p.onGround=false;p.coyote=0;jumpBuf=0;
    if(inp('jump')){p.y-=75*dt;for(const s of playerSolids())if(overlap(p,s))p.y=s.y+s.h;p.walkT+=dt;}
    p.moving=!!dir||inp('jump');p.sink=0;return;}
  if(G&&p.onGround){
    if(!p.held){const o=adjacentObj(p.face,8)||adjacentObj(-p.face,8);if(o){p.held=o;p.face=(o.x+o.w/2)>(p.x+p.w/2)?1:-1;}}
  }else p.held=null;
  if(p.held){const o=p.held,gap=p.face>0?o.x-(p.x+p.w):p.x-(o.x+o.w);if(!objs.includes(o)||Math.abs((o.y+o.h)-(p.y+p.h))>8||gap>12)p.held=null;}
  if(!p.held&&dir)p.face=dir;
  p.pushing=false;
  const slow=(p.inWater?.55:1)*(p.sink>0?.4:1);
  if(p.held){
    const o=p.held,dx=dir*DRAG*slow*dt;
    if(dx){
      if(dir===p.face){const ox=o.x;moveEnt(o,dx,0,solidsFor(o));movePX(o.x-ox,false);}
      else{const ox=p.x;movePX(dx,false);moveEnt(o,p.x-ox,0,solidsFor(o));}
    }
  }else if(dir)movePX(dir*SPD*slow*dt,!G);
  p.moving=!!dir;if(p.moving)p.walkT+=dt*(p.held?.55:slow);
  if(jumpBuf>0&&p.coyote>0&&!p.held&&p.sink===0){p.vy=-JV*(p.inWater?.45:1);p.coyote=0;jumpBuf=0;}
  if(p.inWater){p.vy+=GRAV*.35*dt;if(p.vy>90)p.vy=90;}
  else{p.vy+=GRAV*dt;if(p.vy<0&&!inp('jump'))p.vy+=GRAV*dt*1.4;if(p.vy>900)p.vy=900;}
  const wasAir=!p.onGround,vy=p.vy;
  p.onGround=false;p.y+=p.vy*dt;let onMud=false;
  for(const s of playerSolids()){if(overlap(p,s)){if(p.vy>0){p.y=s.y-p.h;p.onGround=true;onMud=!!s.mud;}else p.y=s.y+s.h;p.vy=0;}}
  // 펄: 딛고 서 있으면 조금씩 빠진다
  {const mx=p.x+7,onObj=objs.some(o=>!o.ghost&&Math.abs(o.y-(p.y+p.h))<1.5&&o.x<p.x+p.w&&o.x+o.w>p.x);
   if(mx>=MUD.x&&mx<MUD.x+MUD.w&&p.vy>=0&&!onObj&&p.y+p.h>=MUD.top-.5){p.sink+=20*dt;p.y=MUD.top+p.sink-p.h;p.vy=0;p.onGround=true;if(p.sink>=22)return die('mud');}
   else if(p.onGround||p.y+p.h<=MUD.top||mx<MUD.x||mx>=MUD.x+MUD.w)p.sink=0;}
  // 물: 머리까지 잠기면 숨이 줄어든다
  if(wl!==null&&p.y+5>wl){p.breath-=dt;if(Math.random()<dt*6)bubbles.push({x:p.x+7+(Math.random()-.5)*6,y:p.y+4,l:1.2});if(p.breath<=0)return die('drown');}
  else p.breath=Math.min(1.4,p.breath+dt*2);
  if(p.onGround&&wasAir&&vy>500)sfx('land');
  p.coyote=p.onGround?.09:p.coyote-dt;
}
function worldTick(dt){
  tideT+=dt;
  const lv=tideLevel();
  objs.sort((a,b)=>(b.y+b.h)-(a.y+a.h));
  for(const o of objs){
    if(o.ghost)continue;
    o.vy=Math.min(o.vy+GRAV*dt,900);if(moveEnt(o,0,o.vy*dt,solidsFor(o)))o.vy=0;
    // 물에 뜨는 몸: 웅덩이와 바다에서는 물 위로 떠오른다
    const wl=waterAt(o.x+o.w/2);
    if(wl!==null&&o.y+o.h>wl+5){const ty=wl-9;const ny=Math.max(ty,o.y-70*dt);const before=o.y;moveEnt(o,0,ny-o.y,solidsFor(o));if(o.y<before)o.vy=0;}
  }
  objs=objs.filter(o=>o.y<700);
  if(!lantern.held&&!lantern.hung){
    lantern.vy=Math.min(lantern.vy+GRAV*dt,900);
    if(moveEnt(lantern,0,lantern.vy*dt,statics.concat(solidObjs(),[boatRect(),{x:MUD.x,y:MUD.top,w:MUD.w,h:30}])))lantern.vy=0;
    const wl=waterAt(lantern.x+4);
    if(wl!==null&&lantern.y+12>wl+2){
      if(lantern.x+4>=SEA.x&&lantern.x+4<SEA.x2)placeLanternAtCp();
      else{lantern.y=Math.max(wl-10,lantern.y-70*dt);lantern.vy=0;}}
    if(lantern.y>600)placeLanternAtCp();
  }
  // 그물: 배에 오른 아이에게 투망이 던져진다
  const n=net,bt=boatRect().y;
  if(n.st==='ready'){
    n.y=NETR.top;n.r=8;

  }else if(n.st==='land'){n.y=bt-6;n.t+=dt;if(n.t>1){n.st='haul';n.t=0;}}

    n.y-=70*dt;n.r=Math.max(10,n.r-50*dt);
    if(n.caught&&!p.dead){p.x+=(NETR.x+3-p.x)*Math.min(1,dt*4);p.y=n.y-6;p.vy=0;

        objs.push({type:'body',ghost:true,x:NETR.x-4,y:178,w:28,h:14,vy:0,face:1});}}
    else if(n.y<=NETR.top){n.st='ready';n.t=-2.5;n.caught=false;}
  }
  for(const q of parts){q.vy+=GRAV*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;}
  parts=parts.filter(q=>q.l>0);
  for(const b of bubbles){b.y-=30*dt;b.x+=Math.sin(time*9+b.y)*.3;b.l-=dt;const wl=waterAt(b.x);if(wl===null||b.y<wl)b.l=0;}
  bubbles=bubbles.filter(b=>b.l>0);
  // 피: 날아가다 땅에 닿으면 그 자리에 얼룩으로 남는다
  for(const q of blood){
    q.vy+=GRAV*.8*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;
    for(const r of statics)if(q.x>r.x&&q.x<r.x+r.w&&q.y>r.y&&q.y<r.y+r.h){
      stains.push({x:q.x,y:Math.max(r.y,q.y-1),r:q.r*.9,d:0,dm:Math.random()<.4?2+Math.random()*5:0});q.l=0;break;}
  }
  blood=blood.filter(q=>q.l>0);if(stains.length>500)stains.splice(0,stains.length-500);
  for(const t of stains)if(t.d<t.dm)t.d+=dt*2.2;
  for(const o of objs)if(o.bloody&&o.bt<1)o.bt=Math.min(1,o.bt+dt*.35);
  // 등불 둘레에 색이 스며든다 (들고 있으면 빨리, 놓여 있으면 천천히)
  {const lx=lantern.x+4,b0=Math.floor((lx-70)/8),b1=Math.floor((lx+70)/8);
   for(let b=Math.max(0,b0);b<=Math.min(trail.length-1,b1);b++){const d=Math.abs(b*8+4-lx)/70;if(d<1)trail[b]=Math.min(1,trail[b]+dt*(lantern.held?1.2:.4)*(1-d));}}
  if(shake>0)shake=Math.max(0,shake-dt*2);
}
function placeLanternAtCp(){const c=checkpoints[cpi];lantern.x=c.x+40;lantern.y=c.y-12;lantern.vy=0;lantern.held=false;}
function lanternHand(){return{x:p.x+7+p.face*9-4,y:p.y+14};}
function die(cause){
  p.dead=true;deadT=0;p.held=null;p.caught=false;deaths++;
  if(cause==='mud'||cause==='drown'){
    const b={type:'body',x:p.x+p.w/2-14,y:cause==='mud'?MUD.bed-26:p.y+p.h-14,w:28,h:14,vy:0,face:p.face};
    for(let k=0;k<2;k++)for(const s of statics)if(overlap(b,s)){if(b.x+b.w/2>s.x+s.w/2)b.x=s.x+s.w;else b.x=s.x-b.w;}

  }
  if(lantern.held){
    lantern.held=false;
    if(cause==='fall')placeLanternAtCp();
    else{lantern.x=p.x+p.w/2-4;lantern.y=p.y-6;lantern.vy=-120;}
  }

}

function tick(dt){

    worldTick(dt);
    if(!p.dead)hazards();
    if(!p.dead){
      if(lantern.held){const h=lanternHand();lantern.x=h.x;lantern.y=h.y;}
      else if(!lantern.hung&&!p.caught&&overlap(p,{x:lantern.x-4,y:lantern.y-4,w:16,h:20})){lantern.held=true;sfx('pick');}
      for(let i=cpi+1;i<checkpoints.length;i++){const c=checkpoints[i];if(p.x>c.x&&p.onGround&&Math.abs(p.y+p.h-c.y)<2)cpi=i;}

      fade=Math.max(0,fade-dt*1.6);
    }else{
      deadT+=dt;fade=clamp((deadT-.45)/.5,0,1);
      if(deadT>1.05)spawn();
    }
    if(state==='play'&&!p.dead){const tx=p.x+7-VW*.42;camX+=(tx-camX)*Math.min(1,dt*5);camX=clamp(camX,-180,WORLD_END-VW);}

}

function drawNetDome(x,y,r){

  for(const [col,w] of [[PAPER,1.8],[INK,.7]]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();

function haloFill(path,ext){ctx.fillStyle=ctx.strokeStyle=PAPER;ctx.lineWidth=ext;ctx.lineJoin='round';path();ctx.stroke();ctx.fill();ctx.fillStyle=ctx.strokeStyle=INK;path();ctx.fill();}

/* 색판: 해 질 녘에서 밤으로, 등불이 지나간 길엔 색이 남고, 등대에 불이 켜지면 새벽 */
function dawnK(){return (state==='ending'||state==='end')?clamp((endT-1.2)/4,0,1):0;}
function colorAt(x){const b=Math.floor(x/8),t=(b>=0&&b<trail.length)?trail[b]:0;return Math.max(clamp(1-(x-300)/1500,.06,1),t*.9,dawnK());}
function mixC(a,b,k){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*k)+','+Math.round(a[1]+(b[1]-a[1])*k)+','+Math.round(a[2]+(b[2]-a[2])*k)+')';}

}
function render(){

  ctx.strokeStyle=PAPER;ctx.lineWidth=1.4;

  for(const x of BOLLARDS){if(x<lo||x>hi)continue;const yb=x>2280?160:230;haloFill(()=>{ctx.beginPath();ctx.rect(x-3,yb-7,6,7);ctx.rect(x-5,yb-9,10,3);},1.6);}

  if(LHX+32>lo&&LHX-8<hi){ctx.save();ctx.translate(LHX-3798,0);
    haloFill(()=>{ctx.beginPath();ctx.moveTo(3798,160);ctx.lineTo(3802,80);ctx.lineTo(3820,80);ctx.lineTo(3824,160);ctx.closePath();},2);
    ctx.fillStyle=PAPER;ctx.beginPath();gouge(3800,122,3822,122,1.1);gouge(3799.6,134,3822.4,134,1.1);gouge(3803,96,3804.5,116,.6);gouge(3801,140,3802.5,156,.6);ctx.fill();
    ctx.strokeStyle=PAPER;ctx.lineWidth=.9;ctx.strokeRect(3807,146,8,14);
    haloFill(()=>{ctx.beginPath();ctx.rect(3797,78,28,3);ctx.rect(3803,62,2,16);ctx.rect(3817,62,2,16);ctx.rect(3810,62,2,16);ctx.moveTo(3801,63);ctx.lineTo(3811,52);ctx.lineTo(3821,63);ctx.closePath();ctx.rect(3810.4,47,1.2,6);},1.6);
    ctx.restore();}
  // 배: 부두에 묶여 물때 따라 오르내린다
  const br=boatRect();
  if(br.x+br.w>lo&&br.x<hi){
    ctx.strokeStyle=INK;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(br.x+4,br.y-5);ctx.quadraticCurveTo(br.x-30,br.y+(224-br.y)*.2+14,BOLLARDS[1],223);ctx.stroke();
    haloFill(()=>{ctx.beginPath();ctx.moveTo(br.x,br.y);ctx.lineTo(br.x+br.w,br.y);ctx.lineTo(br.x+br.w-10,br.y+br.h+6);ctx.lineTo(br.x+8,br.y+br.h+6);ctx.closePath();ctx.rect(br.x+2,br.y-7,3,7);ctx.rect(br.x+br.w-5,br.y-7,3,7);},1.6);
    ctx.fillStyle=PAPER;ctx.beginPath();gouge(br.x+6,br.y+5,br.x+br.w-8,br.y+5,.8);gouge(br.x+14,br.y+11,br.x+br.w-18,br.y+11,.55);gouge(br.x+24,br.y+16,br.x+br.w-30,br.y+16,.4);ctx.fill();}
  // 방파제 위 기중기와 투망
  if(DAVX+24>lo&&BOAT.x-24<hi){
    ctx.strokeStyle=PAPER;ctx.lineWidth=5;seg(DAVX,160,DAVX,103);seg(DAVX+2,105,HOOKX-6,105);
    ctx.strokeStyle=INK;ctx.lineWidth=3;seg(DAVX,160,DAVX,104);seg(DAVX+1,105,HOOKX-5,105);ctx.lineWidth=1.2;seg(DAVX,130,DAVX-22,105);
    const n=net;ctx.lineWidth=.8;
    if(n.st==='ready'){seg(HOOKX,106,HOOKX,NETR.top);drawNetBag(HOOKX,NETR.top+7,7);}
    else if(n.st==='throw'||n.st==='land'){seg(HOOKX,106,THROWX,n.y-n.r*.75);drawNetDome(THROWX,n.y,n.r);}
    else if(n.st==='haul'){seg(HOOKX,106,HOOKX,n.y);drawNetBag(HOOKX,n.y+8,Math.max(8,n.r*.35));}
    else if(n.st==='stuck'){seg(HOOKX,106,HOOKX,NETR.top);drawNetHang(netRect());}
  }
  ctx.fillStyle=INK;for(const q of parts)ctx.fillRect(q.x-1,q.y-1,2.4,2.4);
  // 피 얼룩과 흐르는 방울
  ctx.fillStyle=ctx.strokeStyle=INK;ctx.lineCap='round';
  for(const t of stains){if(t.x<lo||t.x>hi)continue;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
    if(t.d>0){ctx.lineWidth=Math.max(.8,t.r*.7);seg(t.x,t.y,t.x,t.y+t.d);ctx.beginPath();ctx.arc(t.x,t.y+t.d,t.r*.75,0,Math.PI*2);ctx.fill();}}
  for(const q of blood){const sp=Math.hypot(q.vx,q.vy)||1,k=Math.min(5,sp*.018);
    ctx.lineWidth=q.r*1.6;seg(q.x,q.y,q.x-q.vx/sp*k,q.y-q.vy/sp*k);}
  // 아이들
  for(const o of objs){if(o.x>hi||o.x+o.w<lo)continue;drawBody(o);}
  if(!lantern.held)drawLantern(lantern.x,lantern.y);
  if(!p.dead){
    const air=!p.onGround&&!p.climb,armOut=lantern.held||!!p.held||p.climb,lean=p.held&&inp(p.face>0?'left':'right')?-2:(p.held?2:(p.moving?1:0));
    const inMud=p.sink>0;
    if(inMud){ctx.save();ctx.beginPath();ctx.rect(lo,-200,hi-lo,MUD.top+200.5);ctx.clip();}
    drawChild(p.x+7,p.y+28,p.face,p.walkT,p.moving,air,armOut,lean);

  // 물: 웅덩이와 바다 (밀물과 썰물)
  {const lv=tideLevel();
   for(const z of [BASIN,{x:SEA.x,x2:SEA.x2,floor:420}]){if(z.x2<lo||z.x>hi||lv>=z.floor)continue;
     ctx.fillStyle='rgba(38,58,86,.6)';ctx.fillRect(z.x,lv,z.x2-z.x,z.floor-lv);
     ctx.fillStyle=PAPER;ctx.beginPath();for(let x=z.x;x<z.x2-6;x+=11){const o=Math.sin(time*2+x*.13)*.8;gouge(x+2,lv+o,x+9,lv+o-.3,.6);}ctx.fill();
     ctx.beginPath();for(let i=0;i<14;i++){const x=z.x+((i*53.3+time*6)%(z.x2-z.x-10)),y=lv+7+((i*17)%Math.max(8,z.floor-lv-10));if(y<z.floor-3)gouge(x,y,x+6,y,.4);}ctx.fill();}
   ctx.strokeStyle=PAPER;ctx.lineWidth=.7;for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,1.2,0,Math.PI*2);ctx.stroke();}}

  // 어둠과 빛: 판화처럼 층을 나눠 찍는다

  const lights=[];
  let darkA=.48+.32*clamp((cx+VW*.5-500)/1500,0,1);

    const k=clamp(endT/2.5,0,1);darkA=Math.min(darkA,.8-.28*k)*(1-.8*dawnK());
    lights.push([lantern.x+4,lantern.y+7,(140+300*k)*fl,1,1]);
    const ea=clamp((endT-2)/2.5,0,1)*.8;
    if(ea>0)for(const o of objs)if(o.type==='body')lights.push([o.x+14,o.y+7,58,ea,1]);
  }else if(lantern.held&&!p.dead){const h=lanternHand();lights.push([h.x+4,h.y+7,175*fl,1,1]);}
  else{lights.push([lantern.x+4,lantern.y+7,135*fl,1,1]);if(!p.dead)lights.push([p.x+7,p.y+14,46,.55,0]);}
  dctx.setTransform(1,0,0,1,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,dark.width,dark.height);
  for(const b of [[-400,HZ,darkA-.26],[HZ,262,darkA-.16],[262,WH+400,darkA]]){dctx.fillStyle='rgba(23,19,15,'+clamp(b[2],0,1)+')';dctx.fillRect(0,(OY+b[0]*S)*DPR,dark.width,(b[1]-b[0])*S*DPR+1);}
  dctx.globalCompositeOperation='destination-out';
  lights.forEach((L,i)=>{
    const X=(L[0]-cx)*S*DPR,Y=(OY+(L[1]+sy)*S)*DPR,R=L[2]*S*DPR;

    for(const [w,q] of [[.11,.45],[.06,.55]]){dctx.fillStyle='rgba(0,0,0,'+(q*k)+')';dctx.beginPath();dctx.moveTo(X,Y);dctx.lineTo(X+Math.cos(a-w)*R,Y+Math.sin(a-w)*R);dctx.lineTo(X+Math.cos(a+w)*R,Y+Math.sin(a+w)*R);dctx.closePath();dctx.fill();}
  }
  dctx.globalCompositeOperation='source-over';
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(dark,0,0);

}

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0;
function frame(now){
  let d=(now-last)/1000;last=now;if(d>.1)d=.1;if(d<0)d=0;time+=d;acc+=d;
  while(acc>=1/120){tick(1/120);acc-=1/120;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
