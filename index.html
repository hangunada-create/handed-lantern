function tick(dt){

  if(state==='play'){
    if(!p.dead&&!p.caught)stepPlayer(dt);
    if(!p.dead&&lantern.held&&twoHands()){lantern.held=false;lantern.x=p.x+3;lantern.y=p.y+14;lantern.vy=0;if(p.climb&&p.climbC)lantern.on=p.climbC;else if(p.climb&&p.climbS)lantern.slide=true;}   // 두 손으로 붙잡으면 등불은 발밑에 놓인다 (닻줄에서는 갈고리에, 기운 줄에서는 줄에 건다)   // 두 손으로 붙잡으면 등불은 발밑에 놓인다
    worldTick(dt);
    if(!p.dead)hazards();
    if(!p.dead){
      if(lantern.held){const h=lanternHand();lantern.x=h.x;lantern.y=h.y;}
      else if(!twoHands()&&overlap(p,{x:lantern.x-8,y:lantern.y-40,w:24,h:58})){
        if(lantern.inHand){lantern.inHand=false;if(spirit.st==='hidden'){spirit.st='rise';spirit.t=0;sfx('wing');}}
        lantern.held=true;lantern.on=null;lantern.slide=false;sfx('pick');}
      for(let i=0;i<checkpoints.length;i++){const c=checkpoints[i];if(c.ord>cpOrd()&&(lantern.held||lantern.inHand)&&p.x>c.x&&p.x<c.x+900&&p.onGround&&Math.abs(p.y+p.h-c.y)<2)cpi=i;}   // 등불을 들고 지나야 깨어나는 자리가 옮겨진다
      if(cpOrd()>=6&&chT<0){chT=0;sfx('tide');}
      if(Math.floor(cpOrd())===8&&t2T<0){t2T=0;sfx('tide');}
      if(lantern.held&&p.x<ANNEX&&p.x+7>curEnd().x&&p.onGround){state='ending';endT=0;p.face=1;p.moving=false;p.held=null;sfx('end');}
      fade=Math.max(0,fade-dt*1.6);
    }else{
      deadT+=dt;fade=clamp((deadT-.45)/.5,0,1);
      if(deadT>1.55)spawn();
    }
    if(state==='play'&&!p.dead){const tx=p.x+7-VW*.42;camX+=(tx-camX)*Math.min(1,dt*5);camX=clamp(camX,-180,WORLD_END-VW);}
  }else{
    worldTick(dt);endT+=dt;
    if(lantern.held){const h=lanternHand();lantern.x=h.x;lantern.y=h.y;}
    const tx=Math.min(p.x+7-VW*.3,WORLD_END-VW);camX+=(tx-camX)*Math.min(1,dt*1.5);
    const e=curEnd();
    if(e.next!==null){ // 다음 장으로 이어진다
      fade=endT>5.5?clamp((endT-5.5)/1.5,0,1):Math.max(0,fade-dt);
      if(endT>7.3){if(e.age)pendingAge=Math.max(pendingAge,e.age);cpi=e.next;spawn();lantern.held=true;lantern.inHand=false;spirit.st='walk';spirit.x=p.x+70;spirit.y=p.y+28;spirit.a=1;state='play';fade=1;endT=0;}
    }else{
      if(endT>7.5)endCardT+=dt;
      fade=endT>6?clamp((endT-6)/1.5,0,1)*.6:Math.max(0,fade-dt);
      if(state==='ending'&&endCardT>1)state='end';}
  }
}

let last=performance.now(),acc=0,slowT=0,emaD=.016;
function frame(now){
  let d=(now-last)/1000;last=now;if(d>.1)d=.1;if(d<0)d=0;time+=d;acc+=d;
