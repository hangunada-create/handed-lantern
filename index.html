<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>건네받은 등불 — 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#17130f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.btn{position:absolute;width:74px;height:74px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font:600 15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#bG.hint{border-color:rgba(255,200,130,.9);box-shadow:0 0 0 6px rgba(255,200,130,.18)}
.btn.on{background:rgba(255,200,130,.2);color:rgba(255,230,200,.85)}
#bL{left:calc(16px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
#bR{left:calc(102px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
#bG{right:calc(102px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
#bJ{right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="btn" id="bL" data-k="left">◀</div>
  <div class="btn" id="bR" data-k="right">▶</div>
  <div class="btn" id="bG" data-k="grab">잡기</div>
  <div class="btn" id="bJ" data-k="jump">점프</div>
</div>
<script>
'use strict';
/* =========================================================
   건네받은 등불 — 프로토타입 1장
   규칙: 죽으면 처음부터가 아니라, 다음 아이가 온다.
         쓰러진 아이는 그 자리에 남아 길이 된다.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
const plateCv=document.createElement('canvas'),pctx=plateCv.getContext('2d'); // 색판을 따로 찍어 두는 종이
const WH=360;
let W=0,H=0,DPR=1,S=1,VW=480,OY=0;
let DPRCAP=2;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,DPRCAP);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  dark.width=cv.width;dark.height=cv.height;plateCv.width=cv.width;plateCv.height=cv.height;
  S=H/WH;VW=W/S;if(VW<420){S=W/420;VW=420;}OY=(H-WH*S)/2;
}
addEventListener('resize',resize);resize();

const GRAV=1400,JV=410,SPD=170,DRAG=90,PUSH=95,STEP=16;
function rng(s){return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 세계: 1장 「넋건지기」 — 해 질 녘의 갯벌 (설계도: design/chapter1.md) ---------- */
const WORLD_END=4420;
const statics=[
  {x:-260,y:-200,w:80,h:700},                 // 왼쪽 끝
  // 0~1. 깨어남과 갯길
  {x:-180,y:300,w:680,h:200},
  {x:500,y:330,w:60,h:200},{x:560,y:300,w:120,h:200},   // 갯고랑 1
  {x:680,y:330,w:60,h:200},{x:740,y:300,w:120,h:200},   // 갯고랑 2
  {x:860,y:332,w:70,h:200},{x:930,y:300,w:130,h:200},   // 갯고랑 3
  // 2. 첫 펄 (2a 말뚝 펄, 2b 넓은 펄)
  {x:1060,y:324,w:140,h:200},{x:1200,y:300,w:120,h:200},
  {x:1320,y:324,w:232,h:200},{x:1552,y:300,w:128,h:200},
  // 3. 짱뚱어 펄 (아주 넓은 펄, 속에 단단한 땅)
  {x:1680,y:324,w:360,h:200},
  {x:1730,y:300,w:24,h:24,hidden:true},{x:1832,y:300,w:24,h:24,hidden:true},{x:1886,y:300,w:24,h:24,hidden:true},{x:1976,y:300,w:24,h:24,hidden:true},
  {x:2040,y:300,w:80,h:200},
  // 4. 갯바위와 굴밭
  {x:2120,y:250,w:60,h:250,rock:true},{x:2180,y:200,w:120,h:300,rock:true},
  {x:2300,y:250,w:24,h:8,rock:true,knob:true},                    // 바위 틈의 낮은 디딤
  {x:2300,y:300,w:260,h:200},                             // 굴밭과 그 너머
  // 5. 갈림길: 위는 바위 길, 아래는 도깨비 펄
  {x:2560,y:262,w:80,h:238,rock:true},                   // 갈림길의 너럭바위: 위로 오르거나, 펄로 내려서거나
  {x:2640,y:324,w:560,h:200},
  {x:2700,y:215,w:70,h:26,rock:true,cap:true},{x:2830,y:190,w:90,h:26,rock:true,cap:true},   // 버섯바위의 갓 (기둥은 뒤에 서 있다)
  {x:2980,y:210,w:100,h:26,rock:true,cap:true},{x:3135,y:255,w:65,h:26,rock:true,cap:true},
  // 6. 밀물: 깊은 물골
  {x:3200,y:300,w:130,h:200},{x:3330,y:350,w:150,h:200},{x:3480,y:300,w:120,h:200},
  // 7. 마지막 시험: 밀물 드는 말뚝 펄. 높은 갯바위에는 물에 뜬 몸을 타고서만 오른다
  {x:3600,y:258,w:60,h:242,rock:true},                    // 펄 앞 바위턱 (물이 다 차도 잠기지 않는다)
  {x:3660,y:324,w:300,h:200},                             // 펄 바닥
  {x:3960,y:224,w:200,h:276,rock:true},                   // 갓바위로 오르는 높은 바위 (펄에서 76)
  {x:4420,y:-200,w:80,h:700},                 // 오른쪽 끝
];
const spikes=[];
const MUDS=[
  {x:1060,w:140,rate:10,stakes:[1130]},
  {x:1320,w:232,rate:10,stakes:[]},
  {x:1680,w:360,rate:30,stakes:[],holes:[1742,1844,1898,1988],decoys:[1778,1806,1868,1934,1957,2021]},
  {x:2640,w:560,rate:25,stakes:[2690,2750,2810,2870],deep:true},
  {x:3660,w:300,rate:12,stakes:[3770,3850,3930]},
];
const MUD_TOP=300,MUD_BED=324;
const OYSTERS=[[2300,2470]];
const CHANNEL={x:3330,x2:3480,floor:350,full:302};
const SEA_X=4160;                              // 갓바위 너머 밤바다
const FATHER={x:190};                          // 그물을 덮어쓴 몸
const BUOY={x:1905};                           // 아버지 배의 표식이 새겨진 부표
const GATBAWI=[{x:4230,h:74,w:26,tilt:0},{x:4290,h:52,w:20,tilt:.35}]; // 아버지 바위, 아들 바위
const checkpoints=[{x:30,y:300},{x:940,y:300},{x:1210,y:300},{x:1570,y:300},{x:2050,y:300},{x:2500,y:300},{x:3210,y:300},{x:3492,y:300},{x:3612,y:258}];
const BASIN2={x:3660,x2:3960,low:330,full:262};      // 마지막 시험의 밀물: 아이가 올 때마다 다시 든다
const WAITS=[1240,1600,2080,2520,2735,3235,3512,3630,4120,4600];  // 넋이 멈춰 서서 기다리는 곳
const ENDX=4100;
const STAKE_LIST=[];for(const m of MUDS)for(const s of m.stakes)STAKE_LIST.push(s);

const grass=[];(()=>{const r=rng(7);for(const s of statics){if(s.y!==300||s.hidden)continue;for(let x=s.x+2;x<s.x+s.w-2;x+=4+r()*9)grass.push([x,s.y,1+r()*3,(r()-.5)*3]);}})();
const roots=[];
const shells=[];(()=>{const r=rng(17);for(const o of OYSTERS){for(let x=o[0];x<o[1]-2;){const w=4+r()*5;shells.push([x,Math.min(w,o[1]-x),5+r()*5,r()]);x+=w*.8;}}})();
/* 먼 풍경: 유달산, 목포대교, 섬 */
const HZ=226;
const yudal=[];(()=>{const r=rng(23);for(let x=-60;x<=330;x+=6+r()*10){const t=(x+60)/390,base=Math.sin(t*Math.PI);yudal.push([x,HZ-base*(70+r()*55)-(r()<.25?r()*20:0)]);}yudal.push([330,HZ]);yudal.unshift([-60,HZ]);})();
const islands=[[380,560,18],[930,1450,30],[1500,1800,16]];
const boats=[];(()=>{const r=rng(29);for(let x=120;x<2400;x+=260+r()*280)boats.push({x,l:56+r()*40,h:9+r()*5,c:r(),ph:r()*6});})();
const gulls=[];(()=>{const r=rng(31);for(let i=0;i<4;i++)gulls.push({x:r()*1400,y:90+r()*80,v:10+r()*14,ph:r()*6});})();
const FARKIDS=[{x:0,ph:0},{x:130,ph:2},{x:210,ph:4.1},{x:370,ph:1.3},{x:455,ph:3}];
function farKidX(k){return 1520+((k.x+time*7)%540);}
const FARBODY=1905;

/* 물: 1장에서는 장 끝 물골에만 한 번 밀물이 든다 */
let chLevel=350,chT=-1;
function tideLevel(){return chLevel;}
let t2Level=330,t2T=-1;
function waterAt(x){if(x>=BASIN2.x&&x<BASIN2.x2&&t2Level<BASIN2.low)return t2Level;if(x>=CHANNEL.x&&x<CHANNEL.x2&&chLevel<CHANNEL.floor)return chLevel;if(x>=SEA_X)return 298;return null;}
function mudAt(x){for(const m of MUDS)if(x>=m.x&&x<m.x+m.w)return m;return null;}

/* ---------- 상태 ---------- */
let state='title',p,objs,lantern,spirit,wisp,fish,deaths,cpi,camX=-180,deadT,endT,endCardT,panDone,fade=0,jumpBuf=0,time=0,shake=0,parts=[],blood=[],stains=[],bubbles=[];
const trail=new Float32Array(560); // 등불이 지나간 자리(8px 칸마다 0~1)
function initWorld(){
  objs=[];
  lantern={x:FATHER.x+60,y:283,w:8,h:12,vy:0,held:false,hung:false,inHand:true};
  spirit={st:'hidden',x:FATHER.x+14,y:300,t:0,a:0,alt:0,fly:false};
  wisp={x:2700,y:282,a:0,look:-1};
  fish={chain:0,st:'sit',t:0,amb:[{x:430,st:'sit',t:0,hy:0},{x:620,st:'sit',t:0,hy:0},{x:800,st:'sit',t:0,hy:0},{x:1000,st:'sit',t:0,hy:0}]};
  chLevel=CHANNEL.floor;chT=-1;t2Level=BASIN2.low;t2T=-1;
  trail.fill(0);deaths=0;cpi=0;deadT=0;endT=0;endCardT=0;panDone=false;parts=[];blood=[];stains=[];bubbles=[];
  spawn();
}
function spawn(){
  const c=checkpoints[cpi];
  p={x:c.x,y:c.y-28,w:14,h:28,vy:0,onGround:true,coyote:0,face:1,walkT:0,held:null,dead:false,moving:false,pushing:false,sink:0,breath:1.4,inWater:false,climb:false,caught:false,pull:null,anchor:null,vx:0,land:0};
  camX=clamp(p.x+7-VW*.42,-180,WORLD_END-VW);
  if(cpi===8){t2Level=BASIN2.low;t2T=0;}
}
initWorld();

/* ---------- 입력 ---------- */
const keys={left:false,right:false,jump:false,grab:false},tk={left:false,right:false,jump:false,grab:false};
const inp=k=>keys[k]||tk[k];
const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ShiftLeft:'grab',ShiftRight:'grab',KeyE:'grab',KeyX:'grab'};
let isTouch=false;try{isTouch=matchMedia('(pointer:coarse)').matches;}catch(e){}
const touchEl=document.getElementById('touch');if(isTouch)touchEl.style.display='block';
function anyInput(){
  initAudio();
  if(state==='title'){state='play';fade=1;jumpBuf=0;return true;}
  if(state==='end'&&endCardT>1.2){initWorld();state='play';fade=1;jumpBuf=0;return true;}
  return false;
}
addEventListener('keydown',e=>{
  const k=km[e.code];if(k||e.code==='Enter')e.preventDefault();
  if(e.repeat)return;
  if(anyInput())return;
  if(k){if(k==='jump'&&!keys.jump)jumpBuf=.15;keys[k]=true;}
});
addEventListener('keyup',e=>{const k=km[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const ptr=new Map();
function refreshTouch(){
  const s={left:false,right:false,jump:false,grab:false};for(const k of ptr.values())s[k]=true;
  if(s.jump&&!tk.jump)jumpBuf=.15;
  for(const k in s)tk[k]=s[k];
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',s[b.dataset.k]));
}
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();isTouch=true;if(anyInput())return;try{b.setPointerCapture(e.pointerId);}catch(_){}ptr.set(e.pointerId,b.dataset.k);refreshTouch();});
  const up=e=>{ptr.delete(e.pointerId);refreshTouch();};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){isTouch=true;touchEl.style.display='block';}anyInput();});

/* ---------- 소리 ---------- */
let ac=null;
function initAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();startWind();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function startWind(){
  const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
  for(let i=0;i<2000;i++){const a=i/2000;d[i]=d[i]*a+d[len-2000+i]*(1-a);}
  const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=480;const g=ac.createGain();g.gain.value=.05;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  // 파도: 같은 소음을 천천히 부풀었다 가라앉게
  const w=ac.createBufferSource();w.buffer=buf;w.loop=true;w.playbackRate.value=.7;
  const wf=ac.createBiquadFilter();wf.type='lowpass';wf.frequency.value=900;const wg=ac.createGain();wg.gain.value=.06;
  const lfo=ac.createOscillator();lfo.frequency.value=.11;const lg=ac.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  w.connect(wf);wf.connect(wg);wg.connect(ac.destination);w.start(0,1.7);
}
function tone(f,dur,type,vol,slide,delay){if(!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);}
function noiseBurst(dur,vol){if(!ac)return;const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const n=ac.createBufferSource();n.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=ac.createGain();g.gain.value=vol;n.connect(f);f.connect(g);g.connect(ac.destination);n.start();}
function sfx(k){
  if(!ac)return;
  if(k==='pick'){tone(660,1.4,'sine',.07);tone(990,1.8,'sine',.035,0,.09);}
  else if(k==='end'){[440,554,659,880].forEach((f,i)=>tone(f,3.2,'sine',.045,0,i*.3));}
  else if(k==='drown'){tone(320,1,'sine',.07,.35);tone(180,1.3,'sine',.05,.5,.2);noiseBurst(.5,.08);}
  else if(k==='mud'){tone(80,.9,'sine',.25,.6);noiseBurst(.4,.1);}
  else if(k==='oyster'){noiseBurst(.25,.2);tone(1300,.12,'square',.025,.4);tone(70,.6,'sine',.2,.5);}
  else if(k==='deep'){tone(70,1.2,'sine',.25,.5);noiseBurst(.7,.1);}
  else if(k==='pull'){tone(110,.55,'sine',.12,1.7);noiseBurst(.3,.07);}
  else if(k==='room'){noiseBurst(.45,.035);}
  else if(k==='wing'){noiseBurst(.18,.05);tone(520,.5,'sine',.03,1.5,.05);}
  else if(k==='fish'){tone(1500,.05,'sine',.025,.6);}
  else if(k==='tide'){noiseBurst(2.2,.09);tone(90,2.4,'sine',.06,.8);}
  else if(k==='net'){noiseBurst(.35,.2);tone(140,.6,'triangle',.08,.6);}
  else if(k==='throw'){noiseBurst(.3,.06);}
  else if(k==='land'){noiseBurst(.12,.12);}
  else if(k==='fall'){tone(220,1.2,'sine',.08,.25);}
  else{tone(110,.5,'sine',.3,.35);noiseBurst(.15,.15);}
}

/* ---------- 물리 ---------- */
const solidObjs=()=>objs.filter(o=>!o.ghost);
function mudFloorP(){const m=mudAt(p.x+7);return m?[{x:m.x,y:MUD_TOP+p.sink,w:m.w,h:40,mud:true}]:[];}
function playerSolids(){return statics.concat(solidObjs(),mudFloorP());}
function solidsFor(o){const a=statics.slice();for(const m of MUDS)if(!m.deep)a.push({x:m.x,y:MUD_BED-8,w:m.w,h:30});for(const q of objs)if(q!==o&&!q.ghost)a.push(q);return a;}
function moveEnt(e,dx,dy,sol){
  let hit=false;
  if(dx){e.x+=dx;for(const s of sol){if(s!==e&&overlap(e,s)){e.x=dx>0?s.x-e.w:s.x+s.w;hit=true;}}}
  if(dy){e.y+=dy;for(const s of sol){if(s!==e&&overlap(e,s)){e.y=dy>0?s.y-e.h:s.y+s.h;hit=true;}}}
  return hit;
}
function freeAt(x,y){const r={x,y,w:p.w,h:p.h};return !playerSolids().some(s=>overlap(r,s));}
function movePX(dx,allowStep){
  if(!dx)return;p.x+=dx;
  for(const s of playerSolids()){
    if(!overlap(p,s))continue;
    const rise=(p.y+p.h)-s.y;
    if(allowStep&&(p.onGround||p.inWater)&&rise>0&&rise<=STEP&&freeAt(p.x,s.y-p.h)){p.y=s.y-p.h;continue;}
    p.x=dx>0?s.x-p.w:s.x+s.w;
  }
}
function adjacentObj(dir,tol,type){
  for(const o of objs){
    if(o.ghost||(type&&o.type!==type))continue;
    if(Math.abs((o.y+o.h)-(p.y+p.h))>6)continue;
    const gap=dir>0?o.x-(p.x+p.w):p.x-(o.x+o.w);
    if(gap>=-1&&gap<=tol)return o;
  }
  return null;
}
/* 발밑에 단단한 것(땅, 숨은 땅, 몸)이 받치고 있는가 */
function supported(){
  const fy=p.y+p.h;
  for(const s of statics)if(Math.abs(s.y-fy)<1.5&&s.x<p.x+p.w&&s.x+s.w>p.x)return true;
  for(const o of objs)if(!o.ghost&&Math.abs(o.y-fy)<1.5&&o.x<p.x+p.w&&o.x+o.w>p.x)return true;
  return false;
}
let grabPrev=false,bGhint=false;const bGel=document.getElementById('bG')||{};
function stepPlayer(dt){
  const L=inp('left'),R=inp('right'),dir=(R?1:0)-(L?1:0),G=inp('grab'),gEdge=G&&!grabPrev;grabPrev=G;
  const wl=waterAt(p.x+7);p.inWater=wl!==null&&p.y+p.h>wl+2;
  // 말뚝을 붙잡고 몸을 끌어 올리는 중
  if(p.pull){const q=p.pull;q.t+=dt;const k=Math.min(1,q.t/.6);

       else{const near=Math.abs(st-(p.x+7))<=16;drawGripArm(sh[0],sh[1],gx+Math.sin(time*9)*(near?0:.8),p.y+3+Math.sin(time*7)*.6,!near);}}}
    if(lantern.held){const h=lanternHand();drawLantern(h.x,h.y+Math.sin(time*6)*.4);}
    if(inMud)ctx.restore();
  }else if(lantern.held){const h=lanternHand();drawLantern(h.x,h.y);}
  // 물: 물골의 밀물과 갓바위 너머 밤바다
  if(chLevel<CHANNEL.floor&&CHANNEL.x2>lo&&CHANNEL.x<hi)drawWater(CHANNEL,chLevel,chT>.6&&chLevel>CHANNEL.full+.5);
  if(t2Level<BASIN2.low-1&&BASIN2.x2>lo&&BASIN2.x<hi)drawWater({x:BASIN2.x,x2:BASIN2.x2,floor:326},t2Level,t2T>2&&t2Level>BASIN2.full+.5);
  if(hi>SEA_X)drawWater({x:SEA_X,x2:4500,floor:420},298,false);
  ctx.strokeStyle=PAPER;ctx.lineWidth=.7;for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,1.2,0,Math.PI*2);ctx.stroke();}

  // 어둠과 빛: 판화처럼 층을 나눠 찍는다
  const fl=1+Math.sin(time*13)*.02+Math.sin(time*7.3)*.025;
  const lights=[];
  let darkA=.1+.68*nightK;
  if(lantern.held){const h=lanternHand();lights.push([h.x+4,h.y+7,175*fl,1,1]);}
  else{lights.push([lantern.x+4,lantern.y+7,(lantern.inHand?110:135)*fl,1,1]);if(!p.dead)lights.push([p.x+7,p.y+14,46,.55,0]);}
  if(spirit.st!=='hidden'&&spirit.a>0)lights.push([spirit.x,spirit.y-spirit.alt-16,58,.65*spirit.a,2]);
  if(wisp.a>.01)lights.push([wisp.x,wisp.y-16,96+10*Math.sin(time*19),.85*wisp.a,3]);
  for(const k of FARKIDS){const lx=1520+((k.x+time*7)%540)*.9;lights.push([lx-cx*.5+cx+3,257,16,.9*nightK,1]);}
  lights.push([FARBODY-cx*.5+cx+8,259,14,.9*nightK,1]);
  dctx.setTransform(1,0,0,1,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,dark.width,dark.height);
  {const Y=v=>(OY+v*S)*DPR,gr=dctx.createLinearGradient(0,Y(0),0,Y(WH)),A=v=>'rgba(26,24,30,'+clamp(v,0,1)+')';
   gr.addColorStop(0,A(darkA+.06*nightK));gr.addColorStop(.42,A(darkA-.06));gr.addColorStop(.63,A(darkA-.22*nightK-.04));gr.addColorStop(.74,A(darkA-.1*nightK));gr.addColorStop(.86,A(darkA+.04*nightK));gr.addColorStop(1,A(darkA+.1*nightK));
   dctx.fillStyle=A(darkA+.06*nightK);dctx.fillRect(0,0,dark.width,Y(0)+1);dctx.fillStyle=gr;dctx.fillRect(0,Y(0),dark.width,Y(WH)-Y(0));dctx.fillStyle=A(darkA+.1*nightK);dctx.fillRect(0,Y(WH)-1,dark.width,dark.height);}
  dctx.globalCompositeOperation='destination-out';
  lights.forEach((L,i)=>{
    const X=(L[0]-cx)*S*DPR,Y=(OY+(L[1]+sy)*S)*DPR,R=L[2]*S*DPR,gr=dctx.createRadialGradient(X,Y,0,X,Y,R);
    gr.addColorStop(0,'rgba(0,0,0,'+(.95*L[3])+')');gr.addColorStop(.35,'rgba(0,0,0,'+(.8*L[3])+')');gr.addColorStop(.7,'rgba(0,0,0,'+(.3*L[3])+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=gr;dctx.beginPath();dctx.arc(X,Y,R,0,Math.PI*2);dctx.fill();
  });
  dctx.globalCompositeOperation='source-over';
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(dark,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const L of lights){if(!L[4])continue;const X=(L[0]-cx)*S*DPR,Y=(OY+(L[1]+sy)*S)*DPR;
    {const R=L[2]*.55*S*DPR,gr=ctx.createRadialGradient(X,Y,0,X,Y,R),col=L[4]===3?'120,190,180':L[4]===2?'170,180,190':'230,170,80',q=L[4]===1?.16:.08;gr.addColorStop(0,'rgba('+col+','+(q*L[3])+')');gr.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(X,Y,R,0,Math.PI*2);ctx.fill();}}
  ctx.globalCompositeOperation='source-over';

  // 종이 결
  if(!paperPat){try{paperPat=ctx.createPattern(paperTex,'repeat');}catch(e){}}
  if(paperPat){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.6;ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.hypot(W,H)*.62);vg.addColorStop(0,'rgba(23,19,15,0)');vg.addColorStop(1,'rgba(60,50,40,.28)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(OY>0){ctx.fillStyle=INK;ctx.fillRect(0,0,W,OY+.5);ctx.fillRect(0,OY+WH*S-.5,W,H);}
  if(fade>0){ctx.fillStyle='rgba(23,19,15,'+fade+')';ctx.fillRect(0,0,W,H);}
  if(state==='play'&&p.dead&&deadT>.95){const e=1+roomDur(),a=clamp((deadT-.95)/.15,0,1)*clamp((e-deadT)/.15,0,1);if(a>0)drawRoom(a,deadT-.95);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;}

  // 글자
  const serif='"Nanum Myeongjo","Noto Serif KR",serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(state==='title'){
    ctx.fillStyle='rgba(23,19,15,.45)';ctx.fillRect(0,0,W,H);
    const fs=Math.round(clamp(Math.min(W,H)*.075,24,52));
    ctx.fillStyle='#ece5d2';ctx.font='700 '+fs+'px '+serif;ctx.fillText('건네받은 등불',W/2,H*.4);
    ctx.font=Math.round(fs*.36)+'px '+serif;ctx.fillStyle='rgba(236,229,210,'+(.55+.35*Math.sin(time*2.2))+')';
    ctx.fillText(isTouch?'화면을 누르면 시작합니다':'아무 키나 누르면 시작합니다',W/2,H*.4+fs*1.1);
    ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(236,229,210,.5)';
    ctx.fillText(isTouch?'◀ ▶ 이동 · 점프 · 잡기':'← → 이동 · ↑/스페이스 점프 · Shift 잡기',W/2,H*.4+fs*1.9);
    if(H>W)ctx.fillText('가로로 돌리면 더 넓게 보여요',W/2,H*.4+fs*1.9+22);
  }
  if(state==='ending'||state==='end'){
    const a=clamp(endCardT/1.5,0,1);
    if(a>0){
      ctx.fillStyle='rgba(23,19,15,'+(.6*a)+')';ctx.fillRect(0,0,W,H);
      const fs=Math.round(clamp(Math.min(W,H)*.06,20,42));
      ctx.globalAlpha=a;ctx.fillStyle='#ece5d2';ctx.font='700 '+fs+'px '+serif;ctx.font=Math.round(fs*.55)+'px '+serif;ctx.fillText('이 갯벌에 먼저 누운 아이 '+deaths+'명',W/2,H*.42);
      ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(236,229,210,.55)';
      ctx.fillText((isTouch?'화면을 누르면':'아무 키나 누르면')+' 처음부터',W/2,H*.42+fs*1.3);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0,slowT=0,emaD=.016;
function frame(now){
  let d=(now-last)/1000;last=now;if(d>.1)d=.1;if(d<0)d=0;time+=d;acc+=d;
  emaD+=(d-emaD)*.05;if(emaD>.024&&DPRCAP>1){slowT+=d;if(slowT>1.5){DPRCAP-=.5;slowT=0;emaD=.016;resize();}}else slowT=0;
  while(acc>=1/120){tick(1/120);acc-=1/120;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
