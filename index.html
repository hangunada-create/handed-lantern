<!DOCTYPE html>
<html lang="ko">
<head>

<style>

canvas{display:block;position:fixed;left:0;top:0}

#bL{left:calc(16px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}

#bG{right:calc(102px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="btn" id="bL" data-k="left">◀</div>
  <div class="btn" id="bR" data-k="right">▶</div>
  <div class="btn" id="bG" data-k="grab">잡기</div>
  <div class="btn" id="bJ" data-k="jump">점프</div>
</div>
<script>
'use strict';
/* =========================================================
   건네받은 등불 — 프로토타입 1장
   규칙: 죽으면 처음부터가 아니라, 다음 아이가 온다.
         쓰러진 아이는 그 자리에 남아 길이 된다.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
const plateCv=document.createElement('canvas'),pctx=plateCv.getContext('2d'); // 색판을 따로 찍어 두는 종이
const WH=360;
let W=0,H=0,DPR=1,S=1,VW=480,OY=0;
let DPRCAP=2;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,DPRCAP);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  dark.width=cv.width;dark.height=cv.height;plateCv.width=cv.width;plateCv.height=cv.height;
  S=H/WH;VW=W/S;if(VW<420){S=W/420;VW=420;}OY=(H-WH*S)/2;
}
addEventListener('resize',resize);resize();

const GRAV=1400,JV=410,SPD=170,DRAG=90,PUSH=95,STEP=16;
function rng(s){return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 세계: 1장 「넋건지기」 — 해 질 녘의 갯벌 (설계도: design/chapter1.md) ---------- */
const WORLD_END=12700;
const statics=[
  {x:-260,y:-200,w:80,h:700},                 // 왼쪽 끝
  // 0~1. 깨어남과 갯길
  {x:-180,y:300,w:680,h:200},

  {x:680,y:330,w:60,h:200},{x:740,y:300,w:120,h:200},   // 갯고랑 2
  {x:860,y:332,w:70,h:200},{x:930,y:300,w:130,h:200},   // 갯고랑 3
  // 2. 첫 펄 (2a 말뚝 펄, 2b 넓은 펄)

  {x:1680,y:324,w:360,h:200},

  {x:2300,y:250,w:24,h:8,rock:true,knob:true},                    // 바위 틈의 낮은 디딤

  {x:2640,y:324,w:560,h:200},

  {x:2980,y:210,w:100,h:26,rock:true,cap:true},{x:3135,y:255,w:65,h:26,rock:true,cap:true},

  {x:3660,y:324,w:300,h:200},                             // 펄 바닥

  {x:4700,y:300,w:400,h:200,rock:true},                    // 선창

  {x:5404,y:260,w:112,h:14,prop:true},                     // 묶인 배
  {x:5540,y:140,w:460,h:360,rock:true},                    // 방파제
  {x:6700,y:250,w:22,h:250,rock:true},{x:6774,y:250,w:18,h:250,rock:true},   // 잔교

  {x:6820,y:150,w:880,h:350,rock:true},                    // 큰 배

  {x:7700,y:210,w:200,h:290,rock:true},                    // 방조제 (배에서 내려서는 곳)
  {x:7900,y:330,w:240,h:200,rock:true},                    // 물때 웅덩이 바닥
  {x:8140,y:250,w:60,h:250,rock:true},                     // 부두 벽 (웅덩이에서 80)
  {x:8200,y:300,w:320,h:200,rock:true},                    // 낮은 둑: 밀물에 잠긴다. 수문이 있다
  {x:8200,y:263,w:12,h:37,rock:true},{x:8212,y:276,w:12,h:24,rock:true},{x:8224,y:288,w:12,h:12,rock:true},   // 내려서는 돌계단
  {x:8472,y:288,w:12,h:12,rock:true},{x:8484,y:276,w:12,h:24,rock:true},{x:8496,y:264,w:12,h:36,rock:true},{x:8508,y:252,w:12,h:48,rock:true},   // 올라서는 돌계단
  {x:8520,y:250,w:240,h:250,rock:true},                    // 사리 물골 앞
  {x:8900,y:250,w:500,h:250,rock:true},                    // 물골 건너, 방조제 끝 (장화)
  // ===== 4장: 폭풍의 바다 =====
  {x:9600,y:250,w:500,h:14,prop:true},                     // 어선 갑판
  {x:10500,y:250,w:600,h:14,prop:true},                    // 부서진 선체
  {x:11100,y:262,w:800,h:6,prop:true},                     // 흰 천의 길
  // ===== 5장: 등대 =====
  {x:11900,y:250,w:400,h:250,rock:true},                   // 바위섬
  {x:12300,y:178,w:400,h:330,rock:true},                   // 무너진 계단 위 (턱 72)
  {x:12404,y:60,w:88,h:8,prop:true},                       // 등롱실 바닥
  {x:12700,y:-200,w:80,h:700},                 // 오른쪽 끝
];
const spikes=[];
const MUDS=[
  {x:1060,w:140,rate:10,stakes:[1130]},
  {x:1320,w:232,rate:10,stakes:[]},
  {x:1680,w:360,rate:30,stakes:[],holes:[1742,1844,1898,1988],decoys:[1778,1806,1868,1934,1957,2021]},
  {x:2640,w:560,rate:25,stakes:[2690,2750,2810,2870],deep:true},
  {x:3660,w:300,rate:12,stakes:[3770,3850,3930]},
];
const MUD_TOP=300,MUD_BED=324;
const OYSTERS=[[2300,2470]];
const CHANNEL={x:3330,x2:3480,floor:350,full:302};
const SEA_X=4160;                              // 갓바위 너머 밤바다
const FATHER={x:190};                          // 그물을 덮어쓴 몸
const BUOY={x:1905};                           // 아버지 배의 표식이 새겨진 부표
const GATBAWI=[{x:4230,h:74,w:26,tilt:0},{x:4290,h:52,w:20,tilt:.35}]; // 아버지 바위, 아들 바위
const checkpoints=[{x:30,y:300},{x:940,y:300},{x:1210,y:300},{x:1570,y:300},{x:2050,y:300},{x:2500,y:300},{x:3210,y:300},{x:3492,y:300},{x:3612,y:258},
  {x:4730,y:300},{x:5120,y:210},{x:5560,y:140},{x:5940,y:140},{x:6703,y:250},{x:6840,y:150},
  {x:7720,y:210},{x:8150,y:250},{x:8540,y:250},{x:8960,y:250}, {x:9620,y:250},{x:9984,y:250},{x:10520,y:250},{x:11110,y:262}, {x:11930,y:250},{x:12310,y:178}];
const BASIN2={x:3660,x2:3960,low:330,full:262};      // 마지막 시험의 밀물: 아이가 올 때마다 다시 든다
const WAITS=[1240,1600,2080,2520,2735,3235,3512,3630,4120, 4800,5150,5590,5960,6806,6860,7280,7600, 7760,8160,8300,8560,8980,9300, 9700,9990,10300,10540,11095,11400,11880, 12000,12320,12440,12600,12660];  // 넋이 멈춰 서서 기다리는 곳
const ENDX=4100;
const STAKE_LIST=[];for(const m of MUDS)for(const s of m.stakes)STAKE_LIST.push(s);

const grass=[];(()=>{const r=rng(7);for(const s of statics){if(s.y!==300||s.hidden)continue;for(let x=s.x+2;x<s.x+s.w-2;x+=4+r()*9)grass.push([x,s.y,1+r()*3,(r()-.5)*3]);}})();
const roots=[];
const shells=[];(()=>{const r=rng(17);for(const o of OYSTERS){for(let x=o[0];x<o[1]-2;){const w=4+r()*5;shells.push([x,Math.min(w,o[1]-x),5+r()*5,r()]);x+=w*.8;}}})();
/* 먼 풍경: 유달산, 목포대교, 섬 */
const HZ=226;
const yudal=[];(()=>{const r=rng(23);for(let x=-60;x<=330;x+=6+r()*10){const t=(x+60)/390,base=Math.sin(t*Math.PI);yudal.push([x,HZ-base*(70+r()*55)-(r()<.25?r()*20:0)]);}yudal.push([330,HZ]);yudal.unshift([-60,HZ]);})();
const islands=[[380,560,18],[930,1450,30],[1500,1800,16]];
const boats=[];(()=>{const r=rng(29);for(let x=120;x<7300;x+=260+r()*280)boats.push({x,l:56+r()*40,h:9+r()*5,c:r(),ph:r()*6});})();
const gulls=[];(()=>{const r=rng(31);for(let i=0;i<4;i++)gulls.push({x:r()*1400,y:90+r()*80,v:10+r()*14,ph:r()*6});})();
const FARKIDS=[{x:0,ph:0},{x:130,ph:2},{x:210,ph:4.1},{x:370,ph:1.3},{x:455,ph:3}];
function farKidX(k){return 1520+((k.x+time*7)%540);}
const FARBODY=1905;

/* 물: 1장에서는 장 끝 물골에만 한 번 밀물이 든다 */
let chLevel=350,chT=-1;
function tideLevel(){return chLevel;}
let t2Level=330,t2T=-1;
function waterAt(x){if(x>=BASIN2.x&&x<BASIN2.x2&&t2Level<BASIN2.low)return t2Level;if(x>=CHANNEL.x&&x<CHANNEL.x2&&chLevel<CHANNEL.floor)return chLevel;if(x>=SEA_X&&x<4700)return 298;if((x>=5400&&x<5540)||(x>=6000&&x<6700))return HARBOR_WL;
  if(x>=7900&&x<12000){const t=tideLv();if(x>=POOL.x&&x<POOL.x2)return t<POOL.floor?t:null;if(x>=LOWD.x&&x<LOWD.x2)return t<LOWD.floor?t:null;if(x>=SARI.x&&x<SARI.x2)return SARI.wl;if(x>=SEA4.x&&x<SEA4.x2)return SEA4.wl;}
  return null;}
function mudAt(x){for(const m of MUDS)if(x>=m.x&&x<m.x+m.w)return m;return null;}

/* ===== 2장 「고풀이」: 포구 (design/chapter2.md) ===== */
const HARBOR_WL=268;
const NETS=[{x:5078,y:196,w:22,h:104}];             // 덕장에 걸어 말리는 그물
const BOATD={x:5404,w:112,y:260};                    // 묶인 배의 갑판
const NETR={x:5514,w:20,top:98};                     // 방파제에서 늘어지는 투망
const DAVX=NETR.x+52,HOOKX=NETR.x+10,THROWX=BOATD.x+56;
const KPOST=5900,KEDGE=6000;                         // 고풀이 기둥과 방파제 끝
const RAFT_DOCK=6004,RAFT_MAX=6610,RAFT_OUT=6240;
const CRB={x:6722,w:52},CRA={x:6792,w:28},CR_LOW=250,CR_HIGH=150;   // 도르래로 이어진 두 그물
const ENDS=[{x:4100,next:9},{x:7250,next:15},{x:9330,next:19,age:2},{x:1e9,next:null}];     // 장의 끝과 다음 장의 첫 체크포인트
const DRAGA=[90,120,160],JVA=[410,430,410],MUDK=[1,1.6,2.6],WT=[1,2,3],AGESC=[1,1.2,1.4];  // 아이, 소년, 어른
let AGE=0,pendingAge=0,net,knot,raft,crA,crB,cargoT=0;
function curEnd(){return ENDS[cpi<9?0:cpi<15?1:cpi<19?2:3];}
function initCh2(){AGE=0;pendingAge=0;net={st:'ready',t:0,y:NETR.top,r:8,caught:false};knot={n:0,t:0,done:false};
  raft={x:RAFT_OUT,y:HARBOR_WL-6,w:90,h:10,free:false};crA={x:CRA.x,y:CR_LOW,w:CRA.w,h:4};crB={x:CRB.x,y:CR_LOW,w:CRB.w,h:4};cargoT=0;
  objs.push({type:'crate',x:6775,y:236,w:16,h:14,vy:0,wt:1});}
function netRects(){const a=NETS.slice();if(net.st==='stuck')a.push({x:NETR.x,y:NETR.top,w:NETR.w,h:BOATD.y+6-NETR.top});a.push(LADDER);return a;}
function dynSolids(){return [raft,crA,crB,gate].concat(debris);}
function onTop(e,s){return Math.abs(e.y+e.h-s.y)<2.5&&e.x<s.x+s.w&&e.x+e.w>s.x;}
function cradleW(c){let w=0;for(const o of objs){if(o.ghost)continue;const ov=Math.min(o.x+o.w,c.x+c.w)-Math.max(o.x,c.x);if(ov>=o.w*.4&&Math.abs(o.y+o.h-c.y)<3)w+=o.wt||1;}
  if(!p.dead&&p.onGround&&Math.abs(p.y+p.h-c.y)<3&&p.x+7>=c.x&&p.x+7<c.x+c.w)w+=WT[AGE];return w;}
function ch2Tick(dt){
  const n=net,bt=BOATD.y,alive=state==='play'&&!p.dead;
  // 투망: 배에 내려선 아이에게 그물이 던져진다
  if(n.st==='ready'){n.y=NETR.top;n.r=8;const on=alive&&p.onGround&&p.x+7>=BOATD.x&&p.x+7<BOATD.x+BOATD.w&&Math.abs(p.y+p.h-bt)<1.5;
    if(on){n.t+=dt;if(n.t>.7){n.st='throw';n.t=0;sfx('throw');}}else n.t=n.t<0?Math.min(0,n.t+dt):0;}
  else if(n.st==='throw'){n.t+=dt;const k=Math.min(1,n.t/.55);n.y=NETR.top+(bt-6-NETR.top)*k*k;n.r=8+54*k;
    if(k>=1){n.st='land';n.t=0;sfx('land');
      if(alive&&p.x+7>BOATD.x-6&&p.x+7<BOATD.x+BOATD.w+6&&p.y+p.h>bt-40){n.caught=true;p.caught=true;p.held=null;if(lantern.held){lantern.held=false;lantern.x=BOATD.x+BOATD.w/2-4;lantern.y=bt-14;lantern.vy=0;}}}}
  else if(n.st==='land'){n.y=bt-6;n.t+=dt;if(n.t>1){n.st='haul';n.t=0;}}
  else if(n.st==='haul'){n.y-=70*dt;n.r=Math.max(10,n.r-50*dt);
    if(n.caught&&!p.dead){p.x+=(NETR.x+3-p.x)*Math.min(1,dt*4);p.y=n.y-6;p.vy=0;
      if(n.y<=180){die('net');n.st='stuck';n.y=NETR.top;n.caught=false;objs.push({type:'body',ghost:true,x:NETR.x-4,y:158,w:28,h:14,vy:0,face:1,wt:WT[AGE]});}}
    else if(n.y<=NETR.top){n.st='ready';n.t=-2.5;n.caught=false;}}
  // 떼배: 풀려나면 방파제 밑으로 온다. 부표 줄을 당기면 나아가고, 놓으면 밀린다
  {const r=raft;if(r.free){const aboard=alive&&onTop(p,r);let dx=0;
    if(aboard&&p.ropePull)dx=60*dt;else if(aboard)dx=-12*dt;else dx=-80*dt;
    const nx=clamp(r.x+dx,RAFT_DOCK,RAFT_MAX);dx=nx-r.x;
    if(dx){for(const o of objs)if(!o.ghost&&onTop(o,r))o.x+=dx;if(aboard)p.x+=dx;r.x=nx;}}}
  // 도르래: 무거운 쪽이 내려가고 가벼운 쪽이 올라간다
  {const wa=cradleW(crA),wb=cradleW(crB);
   const riding=alive&&(onTop(p,crA)||onTop(p,crB));   // 사람이 타야 도르래가 풀린다. 아무도 없으면 둘 다 내려온다
   for(const [c,up] of [[crA,riding&&wb>wa],[crB,riding&&wa>wb]]){const d=clamp((up?CR_HIGH:CR_LOW)-c.y,-40*dt,40*dt);if(!d)continue;
     if(d<0){for(const o of objs)if(!o.ghost&&onTop(o,c))o.y+=d;if(alive&&onTop(p,c))p.y+=d;}c.y+=d;}
   // 나 그물에 오래 서 있으면 그물이 오므라든다

let ac=null;
function initAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();startWind();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function startWind(){
  const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
  for(let i=0;i<2000;i++){const a=i/2000;d[i]=d[i]*a+d[len-2000+i]*(1-a);}
  const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=480;const g=ac.createGain();g.gain.value=.05;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  // 파도: 같은 소음을 천천히 부풀었다 가라앉게
  const w=ac.createBufferSource();w.buffer=buf;w.loop=true;w.playbackRate.value=.7;
  const wf=ac.createBiquadFilter();wf.type='lowpass';wf.frequency.value=900;const wg=ac.createGain();wg.gain.value=.06;
  const lfo=ac.createOscillator();lfo.frequency.value=.11;const lg=ac.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  w.connect(wf);wf.connect(wg);wg.connect(ac.destination);w.start(0,1.7);
}
function tone(f,dur,type,vol,slide,delay){if(!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);}
function noiseBurst(dur,vol){if(!ac)return;const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const n=ac.createBufferSource();n.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=ac.createGain();g.gain.value=vol;n.connect(f);f.connect(g);g.connect(ac.destination);n.start();}
function sfx(k){
  if(!ac)return;
  if(k==='pick'){tone(660,1.4,'sine',.07);tone(990,1.8,'sine',.035,0,.09);}
  else if(k==='end'){[440,554,659,880].forEach((f,i)=>tone(f,3.2,'sine',.045,0,i*.3));}
  else if(k==='drown'){tone(320,1,'sine',.07,.35);tone(180,1.3,'sine',.05,.5,.2);noiseBurst(.5,.08);}
  else if(k==='mud'){tone(80,.9,'sine',.25,.6);noiseBurst(.4,.1);}
  else if(k==='oyster'){noiseBurst(.25,.2);tone(1300,.12,'square',.025,.4);tone(70,.6,'sine',.2,.5);}
  else if(k==='deep'){tone(70,1.2,'sine',.25,.5);noiseBurst(.7,.1);}
  else if(k==='pull'){tone(110,.55,'sine',.12,1.7);noiseBurst(.3,.07);}
  else if(k==='room'){noiseBurst(.45,.035);}
  else if(k==='wing'){noiseBurst(.18,.05);tone(520,.5,'sine',.03,1.5,.05);}
  else if(k==='knot'){tone(196,1.8,'sine',.1,.97);tone(392,1.2,'sine',.03,.98);}
  else if(k==='fish'){tone(1500,.05,'sine',.025,.6);}
  else if(k==='tide'){noiseBurst(2.2,.09);tone(90,2.4,'sine',.06,.8);}
  else if(k==='net'){noiseBurst(.35,.2);tone(140,.6,'triangle',.08,.6);}
  else if(k==='throw'){noiseBurst(.3,.06);}
  else if(k==='land'){noiseBurst(.12,.12);}
  else if(k==='fall'){tone(220,1.2,'sine',.08,.25);}
  else if(k==='bolt'){noiseBurst(.9,.22);tone(60,1.4,'sine',.2,.5,.05);}
  else if(k==='gate'){tone(150,.9,'sawtooth',.03,1.2);noiseBurst(.3,.04);}
  else if(k==='ghost'){tone(130,1.6,'sine',.14,.5);tone(196,1.6,'sine',.06,.5,.1);noiseBurst(.5,.08);}
  else if(k==='wave'){noiseBurst(1.6,.16);}
  else{tone(110,.5,'sine',.3,.35);noiseBurst(.15,.15);}
}

const solidObjs=()=>objs.filter(o=>!o.ghost);
function mudFloorP(){const m=mudAt(p.x+7);return m?[{x:m.x,y:MUD_TOP+p.sink,w:m.w,h:40,mud:true}]:[];}
function playerSolids(){return statics.concat(solidObjs(),dynSolids(),mudFloorP());}
function solidsFor(o){const a=statics.slice();for(const m of MUDS)if(!m.deep)a.push({x:m.x,y:MUD_BED-8,w:m.w,h:30});for(const q of objs)if(q!==o&&!q.ghost)a.push(q);for(const d of dynSolids())a.push(d);return a;}
function moveEnt(e,dx,dy,sol){
  let hit=false;
  if(dx){e.x+=dx;for(const s of sol){if(s!==e&&overlap(e,s)){e.x=dx>0?s.x-e.w:s.x+s.w;hit=true;}}}
  if(dy){e.y+=dy;for(const s of sol){if(s!==e&&overlap(e,s)){e.y=dy>0?s.y-e.h:s.y+s.h;hit=true;}}}
  return hit;
}
function freeAt(x,y){const r={x,y,w:p.w,h:p.h};return !playerSolids().some(s=>overlap(r,s));}
function movePX(dx,allowStep){
  if(!dx)return;p.x+=dx;
  for(const s of playerSolids()){
    if(!overlap(p,s))continue;
    const rise=(p.y+p.h)-s.y;
    if(allowStep&&(p.onGround||p.inWater)&&rise>0&&rise<=STEP&&freeAt(p.x,s.y-p.h)){p.y=s.y-p.h;continue;}
    p.x=dx>0?s.x-p.w:s.x+s.w;
  }
}
function adjacentObj(dir,tol,type){
  for(const o of objs){
    if(o.ghost||(type&&o.type!==type))continue;
    if(Math.abs((o.y+o.h)-(p.y+p.h))>6)continue;
    const gap=dir>0?o.x-(p.x+p.w):p.x-(o.x+o.w);
    if(gap>=-1&&gap<=tol)return o;
  }
  return null;
}
/* 발밑에 단단한 것(땅, 숨은 땅, 몸)이 받치고 있는가 */
function supported(){
  const fy=p.y+p.h;
  for(const s of statics)if(Math.abs(s.y-fy)<1.5&&s.x<p.x+p.w&&s.x+s.w>p.x)return true;
  for(const o of objs)if(!o.ghost&&Math.abs(o.y-fy)<1.5&&o.x<p.x+p.w&&o.x+o.w>p.x)return true;

    skyG.addColorStop(0,mixC([66,80,130],[150,186,216],dk));skyG.addColorStop(.6,mixC([206,102,66],[238,204,176],dk));skyG.addColorStop(1,mixC([238,166,80],[248,228,172],dk));

  ctx.moveTo(s.x-1,b);ctx.lineTo(s.x-.5,s.y+7+r()*3);ctx.lineTo(s.x+3+r()*3,s.y+1.2);

  // 땅과 바위: 먹판 위에 칼자국
  ctx.fillStyle=INK;
  for(const s of statics)if(!s.hidden&&!s.rock&&!s.prop&&s.x<hi&&s.x+s.w>lo)ctx.fillRect(s.x,s.y,s.w,s.h);
  {const rk=statics.filter(s=>s.rock&&s.x<hi&&s.x+s.w>lo);if(rk.length){ctx.fillStyle=PAPER;ctx.strokeStyle=PAPER;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();for(const s of rk)rockPath(s);ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();for(const s of rk)rockPath(s);ctx.fill();}}
  ctx.fillStyle=PAPER;cutList(carves,lo,hi,0);
  drawPlates(lo,hi,cx,sy);
  // 펄
  for(const m of MUDS)if(m.x+m.w>lo&&m.x<hi)drawMud(m);
  if(BUOY.x>lo&&BUOY.x<hi)drawBuoy();
  for(const x of STAKE_LIST)if(x>lo&&x<hi)drawStake(x);
  if(OYSTERS[0][1]>lo&&OYSTERS[0][0]<hi)drawOysters();
  if(FATHER.x+80>lo&&FATHER.x-80<hi&&state!=='epi'&&!finalEnd){if(dawn>.3)drawBoots(FATHER.x-64,300);drawFather();}
  if(hi>4900)drawCh2(lo,hi);
  if(hi>7600||kid)drawCh345(lo,hi);
  ctx.fillStyle=INK;for(const q of parts)ctx.fillRect(q.x-1,q.y-1,2.4,2.4);
  // 피 얼룩과 흐르는 방울
  ctx.fillStyle=ctx.strokeStyle=INK;ctx.lineCap='round';
  for(const t of stains){if(t.x<lo||t.x>hi)continue;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
    if(t.d>0){ctx.lineWidth=Math.max(.8,t.r*.7);seg(t.x,t.y,t.x,t.y+t.d);ctx.beginPath();ctx.arc(t.x,t.y+t.d,t.r*.75,0,Math.PI*2);ctx.fill();}}
  for(const q of blood){const sp=Math.hypot(q.vx,q.vy)||1,k=Math.min(5,sp*.018);
    ctx.lineWidth=q.r*1.6;seg(q.x,q.y,q.x-q.vx/sp*k,q.y-q.vy/sp*k);}
  // 짱뚱어
  for(const f of fish.amb){if(f.x<lo||f.x>hi)continue;drawHole(f.x+9);if(f.st==='sit')drawFish(f.x,300,f.hop||0);}
  {const holes=MUDS[2].holes;if(fish.chain<holes.length){const hx=holes[fish.chain];
    if(fish.st==='sit')drawFish(hx-1,MUD_TOP+1,0);
    else{const k=clamp(fish.t/.25,0,1);if(k<1){ctx.save();ctx.beginPath();ctx.rect(hx-12,MUD_TOP-20,24,21);ctx.clip();drawFish(hx-1,MUD_TOP+1+k*8,0);ctx.restore();}}}}
  // 넋과 도깨비불
  if(spirit.st!=='hidden')drawSpirit(spirit.x,spirit.y-spirit.alt-Math.abs(Math.sin(time*2.2))*.8,spirit.a,spirit.alt>4,spirit.moving);
  if(wisp.a>.01)drawWisp(wisp.x,wisp.y,wisp.a*(.8+.2*Math.sin(time*23)*Math.sin(time*7)),wisp.look);
  // 아이들
  for(const o of objs){if(o.x>hi||o.x+o.w<lo)continue;if(o.type==='crate')drawCrate(o);else drawBody(o);}
  if(!lantern.held)drawLantern(lantern.x,lantern.y);
  if(!p.dead){
    const air=!p.onGround,armOut=lantern.held||!!p.held||!!p.pull||p.climb||p.hang||p.ropePull||p.wheel||p.brace||state==='lamp',lean=p.pull?2:(p.held&&inp(p.face>0?'left':'right')?-2:(p.held?2:(p.moving?1:0)));
    const inMud=p.sink>0;
    if(inMud){ctx.save();ctx.beginPath();ctx.rect(lo,-200,hi-lo,MUD_TOP+200.5);ctx.clip();}
    {const q=clamp(p.land/.14,0,1)*.16;ctx.save();ctx.translate(p.x+7,p.y+28);ctx.scale((1+q)*AGESC[AGE],(1-q)*AGESC[AGE]);ctx.translate(-(p.x+7),-(p.y+28));
     drawAge=AGE;drawChild(p.x+7,p.y+28,p.face,p.walkT,p.moving,air,armOut,lean);drawAge=0;ctx.restore();}
    {// 말뚝 쪽으로 뻗는 손, 붙잡고 끌어 오르는 손, 버티고 선 손
     const sh=[p.x+7-p.face*.6,p.y+10.8];let st=null,mode=null;
     if(p.pull){st=p.pull.x;mode='grip';}
     else if(p.anchor!==null&&p.onGround){st=p.anchor;mode='hold';}
     else if(inMud){for(const x of STAKE_LIST)if(Math.abs(p.x+7-x)<=26&&(st===null||Math.abs(p.x+7-x)<Math.abs(p.x+7-st)))st=x;if(st!==null)mode='reach';}
     if(mode){const d=Math.sign(st-(p.x+7))||p.face,gx=st-d*1.4;
       if(mode==='grip'){const gy=MUD_TOP-19;drawGripArm(sh[0],sh[1],gx,gy,false);if(!lantern.held)drawGripArm(sh[0]+p.face*1.2,sh[1]+.6,gx,gy+3.2,false);}
       else if(mode==='hold')drawGripArm(sh[0],sh[1],gx,p.y+9,false);
       else{const near=Math.abs(st-(p.x+7))<=16;drawGripArm(sh[0],sh[1],gx+Math.sin(time*9)*(near?0:.8),p.y+3+Math.sin(time*7)*.6,!near);}}}
    if(lantern.held){const h=lanternHand();drawLantern(h.x,h.y+Math.sin(time*6)*.4);}
    if(inMud)ctx.restore();
  }else if(lantern.held){const h=lanternHand();drawLantern(h.x,h.y);}
  // 물: 물골의 밀물과 갓바위 너머 밤바다
  if(chLevel<CHANNEL.floor&&CHANNEL.x2>lo&&CHANNEL.x<hi)drawWater(CHANNEL,chLevel,chT>.6&&chLevel>CHANNEL.full+.5);
  if(t2Level<BASIN2.low-1&&BASIN2.x2>lo&&BASIN2.x<hi)drawWater({x:BASIN2.x,x2:BASIN2.x2,floor:326},t2Level,t2T>2&&t2Level>BASIN2.full+.5);
  if(hi>SEA_X&&lo<4700)drawWater({x:SEA_X,x2:4700,floor:420},298,false);
  if(hi>5400&&lo<5540)drawWater({x:5400,x2:5540,floor:420},HARBOR_WL,false);
  if(hi>6000&&lo<6700)drawWater({x:6000,x2:6700,floor:420},HARBOR_WL,false);
  if(hi>7900&&lo<9000){const t=tideLv();
    if(t<POOL.floor-1)drawWater(POOL,t,false);if(t<LOWD.floor-1)drawWater(LOWD,t,false);
    drawWater({x:SARI.x,x2:SARI.x2,floor:420},SARI.wl,flowOn());}
  if(hi>SEA4.x&&lo<SEA4.x2){const a=Math.max(SEA4.x,Math.floor(lo/110)*110-110),b=Math.min(SEA4.x2,hi+20);if(a<11100)drawWater({x:a,x2:Math.min(b,11100),floor:420},SEA4.wl,true);if(b>11100)drawWater({x:Math.max(a,11100),x2:b,floor:420},SEA4.wl,false);}
  drawStorm(lo,hi,cx);
  ctx.strokeStyle=PAPER;ctx.lineWidth=.7;for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,1.2,0,Math.PI*2);ctx.stroke();}

  // 어둠과 빛: 판화처럼 층을 나눠 찍는다
  const fl=1+Math.sin(time*13)*.02+Math.sin(time*7.3)*.025;
  const lights=[];
  const nightK=clamp((cx+VW*.5-800)/1900,0,1);let darkA=(.44+.44*nightK)*(1-dawn);
  if(lantern.held){const h=lanternHand();lights.push([h.x+4,h.y+7,175*fl,1,1]);}
  else{lights.push([lantern.x+4,lantern.y+7,(lantern.inHand?110:135)*fl,1,1]);if(!p.dead)lights.push([p.x+7,p.y+14,46,.55,0]);}
  if(spirit.st!=='hidden'&&spirit.a>0)lights.push([spirit.x,spirit.y-spirit.alt-16,58,.65*spirit.a,2]);
  if(wisp.a>.01)lights.push([wisp.x,wisp.y-16,96+10*Math.sin(time*19),.85*wisp.a,3]);
  for(const k of FARKIDS){const lx=farKidX(k);lights.push([lx-cx*.45+cx+3,251,24,.9,1]);}
  lights.push([FARBODY-cx*.45+cx+9,255,20,.9,1]);
  if(hi>10500&&lo<11200&&ghostLit())for(const c of GHOST)lights.push([c,188,78,.8,3]);
  if(beam>0&&hi>12300)lights.push([LENS.x,LENS.y,150*beam,1,1]);
  dctx.setTransform(1,0,0,1,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,dark.width,dark.height);
  for(const b of [[-400,HZ,darkA-.26+.16*nightK],[HZ,262,darkA-.16+.08*nightK],[262,WH+400,darkA-.07]]){dctx.fillStyle='rgba(23,19,15,'+clamp(b[2],0,1)+')';dctx.fillRect(0,(OY+b[0]*S)*DPR,dark.width,(b[1]-b[0])*S*DPR+1);}
  dctx.globalCompositeOperation='destination-out';
  lights.forEach((L,i)=>{
    const X=(L[0]-cx)*S*DPR,Y=(OY+(L[1]+sy)*S)*DPR,R=L[2]*S*DPR;
    for(const [fr,q] of [[1,.3],[.8,.4],[.6,.5],[.42,.7]]){
      dctx.fillStyle='rgba(0,0,0,'+(q*L[3])+')';dctx.beginPath();
      for(let k=0;k<=44;k++){const a=k/44*Math.PI*2,rr=R*fr*(1+.04*Math.sin(a*5+i*1.7+fr*9)+.025*Math.sin(a*13+i*3.1));const px=X+Math.cos(a)*rr,py=Y+Math.sin(a)*rr;if(k)dctx.lineTo(px,py);else dctx.moveTo(px,py);}
      dctx.closePath();dctx.fill();}
  });
  dctx.globalCompositeOperation='source-over';
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(dark,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const L of lights){if(!L[4])continue;const X=(L[0]-cx)*S*DPR,Y=(OY+(L[1]+sy)*S)*DPR;
    for(const fr of [.6,.38,.2]){ctx.fillStyle=L[4]===3?'rgba(90,200,185,'+(.07*L[3])+')':L[4]===2?'rgba(170,190,210,'+(.035*L[3])+')':'rgba(243,150,60,'+(.06*L[3])+')';ctx.beginPath();ctx.arc(X,Y,L[2]*fr*S*DPR,0,Math.PI*2);ctx.fill();}}
  ctx.globalCompositeOperation='source-over';

  // 번개, 등대의 빛줄기
  if(camX>9300&&camX<11200&&(boltT%BOLT_T)<.16){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(240,236,224,.55)';ctx.fillRect(0,0,cv.width,cv.height);}
  if(beam>0){ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';const X=(LENS.x-cx)*S*DPR,Y=(OY+LENS.y*S)*DPR,L=1500*S*DPR*Math.cos(time*.8),sp=Math.abs(L)*.085;
    ctx.fillStyle='rgba(243,178,84,'+(.2*beam)+')';ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+L,Y+Math.abs(L)*.03-sp);ctx.lineTo(X+L,Y+Math.abs(L)*.03+sp);ctx.closePath();ctx.fill();ctx.globalCompositeOperation='source-over';}
  // 종이 결
  if(!paperPat){try{paperPat=ctx.createPattern(paperTex,'repeat');}catch(e){}}
  if(paperPat){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.6;ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.hypot(W,H)*.62);vg.addColorStop(0,'rgba(23,19,15,0)');vg.addColorStop(1,'rgba(23,19,15,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(OY>0){ctx.fillStyle=INK;ctx.fillRect(0,0,W,OY+.5);ctx.fillRect(0,OY+WH*S-.5,W,H);}
  if(fade>0){ctx.fillStyle='rgba(23,19,15,'+fade+')';ctx.fillRect(0,0,W,H);}
  if(state==='play'&&p.dead&&deadT>.95){const e=1+roomDur(),a=clamp((deadT-.95)/.15,0,1)*clamp((e-deadT)/.15,0,1);if(a>0)drawRoom(a,deadT-.95);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;}

  if(whiteT>0){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(244,236,216,'+whiteT+')';ctx.fillRect(0,0,W,H);}
  if(state==='epi'&&epiT<3.2){const a=clamp(epiT/.4,0,1)*clamp((3.2-epiT)/.5,0,1);if(a>0)drawRoom(a,9);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;}
  // 글자
  const serif='"Nanum Myeongjo","Noto Serif KR",serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(state==='title'){
    ctx.fillStyle='rgba(23,19,15,.45)';ctx.fillRect(0,0,W,H);
    const fs=Math.round(clamp(Math.min(W,H)*.075,24,52));
    ctx.fillStyle='#ece5d2';ctx.font='700 '+fs+'px '+serif;ctx.fillText('건네받은 등불',W/2,H*.4);
    ctx.font=Math.round(fs*.36)+'px '+serif;ctx.fillStyle='rgba(236,229,210,'+(.55+.35*Math.sin(time*2.2))+')';
    ctx.fillText(isTouch?'화면을 누르면 시작합니다':'아무 키나 누르면 시작합니다',W/2,H*.4+fs*1.1);
    ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(236,229,210,.5)';
    ctx.fillText(isTouch?'◀ ▶ 이동 · 점프 · 잡기':'← → 이동 · ↑/스페이스 점프 · Shift 잡기',W/2,H*.4+fs*1.9);
    if(H>W)ctx.fillText('가로로 돌리면 더 넓게 보여요',W/2,H*.4+fs*1.9+22);
  }
  if(finalEnd){ctx.fillStyle='#f4ecd8';ctx.fillRect(0,0,W,H);const a=clamp(endCardT/2,0,1),fs=Math.round(clamp(Math.min(W,H)*.075,24,52));
    ctx.globalAlpha=a;ctx.fillStyle=INK;ctx.font='700 '+fs+'px '+serif;ctx.fillText('건네받은 등불',W/2,H*.44);
    if(endCardT>3){ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(23,19,15,.5)';ctx.fillText((isTouch?'화면을 누르면':'아무 키나 누르면')+' 처음부터',W/2,H*.44+fs*1.5);}ctx.globalAlpha=1;}
  if((state==='ending'||state==='end')&&!finalEnd){
    const a=clamp(endCardT/1.5,0,1);
    if(a>0){
      ctx.fillStyle='rgba(23,19,15,'+(.6*a)+')';ctx.fillRect(0,0,W,H);
      const fs=Math.round(clamp(Math.min(W,H)*.06,20,42));
      ctx.globalAlpha=a;ctx.fillStyle='#ece5d2';ctx.font='700 '+fs+'px '+serif;ctx.font=Math.round(fs*.55)+'px '+serif;ctx.fillText('이 갯벌에 먼저 누운 아이 '+deaths+'명',W/2,H*.42);
      ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(236,229,210,.55)';
      ctx.fillText((isTouch?'화면을 누르면':'아무 키나 누르면')+' 처음부터',W/2,H*.42+fs*1.3);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0,slowT=0,emaD=.016;
function frame(now){
  let d=(now-last)/1000;last=now;if(d>.1)d=.1;if(d<0)d=0;time+=d;acc+=d;
  emaD+=(d-emaD)*.05;if(emaD>.024&&DPRCAP>1){slowT+=d;if(slowT>1.5){DPRCAP-=.5;slowT=0;emaD=.016;resize();}}else slowT=0;
  while(acc>=1/120){tick(1/120);acc-=1/120;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
